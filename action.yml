name: Incident to Promtool
description: Replay captured incidents against Prometheus alert rules before and after a Git change.
inputs:
  fixture:
    description: Path to one generated incident test fixture, relative to repo-path. Provide exactly one of fixture, fixtures, bundle, or bundles.
    required: false
  fixtures:
    description: Newline-separated generated incident test fixture paths, relative to repo-path.
    required: false
  bundle:
    description: Repository-root-relative incident ZIP path in before-ref.
    required: false
  bundles:
    description: Newline-separated repository-root-relative incident ZIP paths in before-ref.
    required: false
  fixture-ref:
    description: Git revision containing the repository-root-relative fixture and capture summary paths. Use with fixture or fixtures. Omit to read from the checkout.
    required: false
  capture-summaries:
    description: Newline-separated capture summary paths in the same order as the fixtures. Use with fixture or fixtures.
    required: false
  rule-files:
    description: Newline-separated rule paths from the repository root. Fixture mode reads these from both refs. Bundle mode reads these from after-ref.
    required: true
  rule-format:
    description: Either prometheus or kubernetes. Applies to both versions in fixture mode and proposed rules in bundle mode.
    default: prometheus
  gate:
    description: Use strict to fail on any failing proposed checkpoint or regressions to fail only on newly failing checkpoints.
    default: strict
  repo-path:
    description: Checkout directory, relative to the workflow workspace if not absolute.
    default: '.'
  before-ref:
    description: Git revision containing the baseline rules or bundles. The default is the first parent of the PR merge candidate.
    default: 'HEAD^1'
  after-ref:
    description: Proposed Git revision. The default is the checked-out PR merge candidate.
    default: HEAD
  promtool-path:
    description: Path to an existing promtool executable or command name. The action installs promtool on Linux x64 when omitted.
outputs:
  report-path:
    description: Path to the generated Markdown report on the runner, when rule comparison completes.
    value: ${{ steps.replay.outputs.report-path }}
  json-report-path:
    description: Path to the generated JSON report on the runner, when rule comparison completes.
    value: ${{ steps.replay.outputs.json-report-path }}
  newly-failed:
    description: Number of checkpoints that passed before and failed after the rule changes.
    value: ${{ steps.replay.outputs.newly-failed }}
runs:
  using: composite
  steps:
    - name: Replay incident
      id: replay
      shell: bash
      env:
        INCIDENT_ACTION_PATH: ${{ github.action_path }}
        INCIDENT_FIXTURE: ${{ inputs.fixture }}
        INCIDENT_FIXTURES: ${{ inputs.fixtures }}
        INCIDENT_BUNDLE: ${{ inputs.bundle }}
        INCIDENT_BUNDLES: ${{ inputs.bundles }}
        INCIDENT_FIXTURE_REF: ${{ inputs.fixture-ref }}
        INCIDENT_CAPTURE_SUMMARIES: ${{ inputs.capture-summaries }}
        INCIDENT_RULE_FILES: ${{ inputs.rule-files }}
        INCIDENT_RULE_FORMAT: ${{ inputs.rule-format }}
        INCIDENT_GATE: ${{ inputs.gate }}
        INCIDENT_REPO_PATH: ${{ inputs.repo-path }}
        INCIDENT_BEFORE_REF: ${{ inputs.before-ref }}
        INCIDENT_AFTER_REF: ${{ inputs.after-ref }}
        INCIDENT_PROMTOOL_PATH: ${{ inputs.promtool-path }}
      run: bash "$INCIDENT_ACTION_PATH/scripts/replay-action.sh"
