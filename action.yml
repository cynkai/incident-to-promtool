name: Incident to Promtool
description: Replay captured incidents against Prometheus alert rules before and after a Git change.
inputs:
  fixture:
    description: Path to one generated incident test fixture, relative to repo-path. Provide exactly one of fixture, fixtures, bundle, or bundles.
    required: false
  fixtures:
    description: Newline-separated generated incident test fixture paths, relative to repo-path.
    required: false
  bundle:
    description: Repository-root-relative incident ZIP path in before-ref.
    required: false
  bundles:
    description: Newline-separated repository-root-relative incident ZIP paths in before-ref.
    required: false
  bundle-max-gap:
    description: Maximum allowed gap between original samples or at the capture boundaries, such as 30s. Use with bundle or bundles.
    required: false
  bundle-required-metrics:
    description: Newline-separated metric names that must have at least one observed sample in each bundle. Use with bundle or bundles.
    required: false
  fixture-ref:
    description: Git revision containing the repository-root-relative fixture and capture summary paths. Use with fixture or fixtures. Omit to read from the checkout.
    required: false
  capture-summaries:
    description: Newline-separated capture summary paths in the same order as the fixtures. Use with fixture or fixtures.
    required: false
  rule-files:
    description: Newline-separated rule paths from the repository root. Fixture mode reads these from both refs. Bundle mode reads these from after-ref and uses the archived baseline.
    required: false
  before-rule-files:
    description: Newline-separated repository-root-relative rule paths at before-ref. Pair with after-rule-files. These files define the comparison baseline.
    required: false
  after-rule-files:
    description: Newline-separated repository-root-relative rule paths at after-ref. Pair with before-rule-files.
    required: false
  rule-format:
    description: Either prometheus or kubernetes. Applies to rule files read from Git.
    default: prometheus
  gate:
    description: Use strict to fail on any failing proposed checkpoint or regressions to fail only on newly failing checkpoints.
    default: strict
  timeline-alertname:
    description: Alert name for the optional first-firing timing gate. Provide with timeline-end and at least one of timeline-max-delay or timeline-fire-by.
    required: false
  timeline-end:
    description: Last inclusive evaluation offset for the timing gate, such as 10m.
    required: false
  timeline-max-delay:
    description: Maximum allowed delay of the proposed rule's first firing, such as 0s or 1m.
    required: false
  timeline-fire-by:
    description: Latest allowed evaluation offset for the proposed rule's first firing, such as 5m.
    required: false
  timeline-fixture:
    description: Choose the timing gate fixture by its exact fixture path. Required for the timing gate when comparing multiple fixtures.
    required: false
  timeline-bundle:
    description: Choose the timing gate bundle by its exact ZIP path. Required for the timing gate when comparing multiple bundles.
    required: false
  timeline-policy:
    description: Path to a JSON policy for multiple first-firing timing checks. Provide it as the only timing input.
    required: false
  repo-path:
    description: Checkout directory, relative to the workflow workspace if not absolute.
    default: '.'
  before-ref:
    description: Git revision containing the baseline rule files, bundle ZIPs, or both. The default is the first parent of the PR merge candidate.
    default: 'HEAD^1'
  after-ref:
    description: Proposed Git revision. The default is the checked-out PR merge candidate.
    default: HEAD
  promtool-path:
    description: Path to an existing promtool executable or command name. The action installs promtool on Linux x64 when omitted.
outputs:
  report-path:
    description: Path to the generated Markdown report on the runner, when rule comparison completes.
    value: ${{ steps.replay.outputs.report-path }}
  json-report-path:
    description: Path to the generated JSON report on the runner, when rule comparison completes.
    value: ${{ steps.replay.outputs.json-report-path }}
  junit-report-path:
    description: Path to the generated JUnit XML report on the runner, when rule comparison completes.
    value: ${{ steps.replay.outputs.junit-report-path }}
  newly-failed:
    description: Number of checkpoints that passed before and failed after the rule changes.
    value: ${{ steps.replay.outputs.newly-failed }}
  timeline-passed:
    description: The string true or false when an optional timing gate or policy runs.
    value: ${{ steps.replay.outputs.timeline-passed }}
  bundle-coverage-passed:
    description: The string true or false when a bundle gap or required-metric check runs. When both are configured, both must pass.
    value: ${{ steps.replay.outputs.bundle-coverage-passed }}
runs:
  using: composite
  steps:
    - name: Replay incident
      id: replay
      shell: bash
      env:
        INCIDENT_ACTION_PATH: ${{ github.action_path }}
        INCIDENT_FIXTURE: ${{ inputs.fixture }}
        INCIDENT_FIXTURES: ${{ inputs.fixtures }}
        INCIDENT_BUNDLE: ${{ inputs.bundle }}
        INCIDENT_BUNDLES: ${{ inputs.bundles }}
        INCIDENT_BUNDLE_MAX_GAP: ${{ inputs.bundle-max-gap }}
        INCIDENT_BUNDLE_REQUIRED_METRICS: ${{ inputs.bundle-required-metrics }}
        INCIDENT_FIXTURE_REF: ${{ inputs.fixture-ref }}
        INCIDENT_CAPTURE_SUMMARIES: ${{ inputs.capture-summaries }}
        INCIDENT_RULE_FILES: ${{ inputs.rule-files }}
        INCIDENT_BEFORE_RULE_FILES: ${{ inputs.before-rule-files }}
        INCIDENT_AFTER_RULE_FILES: ${{ inputs.after-rule-files }}
        INCIDENT_RULE_FORMAT: ${{ inputs.rule-format }}
        INCIDENT_GATE: ${{ inputs.gate }}
        INCIDENT_TIMELINE_ALERTNAME: ${{ inputs.timeline-alertname }}
        INCIDENT_TIMELINE_END: ${{ inputs.timeline-end }}
        INCIDENT_TIMELINE_MAX_DELAY: ${{ inputs.timeline-max-delay }}
        INCIDENT_TIMELINE_FIRE_BY: ${{ inputs.timeline-fire-by }}
        INCIDENT_TIMELINE_FIXTURE: ${{ inputs.timeline-fixture }}
        INCIDENT_TIMELINE_BUNDLE: ${{ inputs.timeline-bundle }}
        INCIDENT_TIMELINE_POLICY: ${{ inputs.timeline-policy }}
        INCIDENT_REPO_PATH: ${{ inputs.repo-path }}
        INCIDENT_BEFORE_REF: ${{ inputs.before-ref }}
        INCIDENT_AFTER_REF: ${{ inputs.after-ref }}
        INCIDENT_PROMTOOL_PATH: ${{ inputs.promtool-path }}
      run: bash "$INCIDENT_ACTION_PATH/scripts/replay-action.sh"
