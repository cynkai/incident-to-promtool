name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  promtool:
    name: promtool ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['3.9.0', '3.11.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download and verify promtool
        env:
          VERSION: ${{ matrix.version }}
        run: bash scripts/install-promtool.sh "$VERSION" "$RUNNER_TEMP"
      - name: Set up test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run tests
        run: |
          PROMTOOL="$RUNNER_TEMP/promtool" "$RUNNER_TEMP/test-venv/bin/python" -m unittest discover -s tests -v
      - name: Run the quickstart from outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          report=$(PROMTOOL="$RUNNER_TEMP/promtool" bash "$GITHUB_WORKSPACE/scripts/demo.sh")
          [[ "$report" == '## Prometheus alert comparison'* ]]
          [[ "$report" == *'| Before | Failed | 1/2 |'* ]]
          [[ "$report" == *'| After | Passed | 2/2 |'* ]]
      - name: Smoke test the installed wheel
        if: matrix.version == '3.11.0'
        run: |
          smoke=$(mktemp -d "$RUNNER_TEMP/wheel-smoke.XXXXXXXX")
          "$RUNNER_TEMP/test-venv/bin/python" -m pip wheel --no-deps --wheel-dir "$smoke/wheels" .
          wheels=("$smoke"/wheels/*.whl)
          [[ ${#wheels[@]} -eq 1 && -f ${wheels[0]} ]]
          python3 -m venv "$smoke/venv"
          "$smoke/venv/bin/python" -m pip install "${wheels[0]}[kubernetes]"

          cd "$smoke"
          demo="$GITHUB_WORKSPACE/demo"
          cli="$smoke/venv/bin/incident-to-promtool"
          "$cli" snapshot "$demo/alertmanager.incident.json" --matrix "$demo/incident.matrix.json" \
            --output payment.matrix.json
          "$cli" inspect "$demo/alertmanager.incident.json" --matrix payment.matrix.json \
            --format json --max-gap 30s > coverage.json
          "$cli" "$demo/alertmanager.incident.json" --matrix payment.matrix.json \
            --output payment.test.yml --summary-format json > summary.json
          "$cli" timeline payment.test.yml --before "$demo/before.rules.yml" --after "$demo/after.rules.yml" \
            --alertname PaymentErrorsHigh --end 10m --max-delay 0s \
            --format json --promtool "$RUNNER_TEMP/promtool" > timeline.json

          timeline_repo="$smoke/timeline-repo"
          git init --quiet "$timeline_repo"
          git -C "$timeline_repo" config user.name 'Integration Test'
          git -C "$timeline_repo" config user.email 'test@example.invalid'
          cp payment.test.yml summary.json "$timeline_repo/"
          cp "$demo/kubernetes/after.yml" "$timeline_repo/fast rules.yml"
          git -C "$timeline_repo" add --all
          git -C "$timeline_repo" commit --quiet -m 'Capture an incident with the fast rule'
          rm -- "$timeline_repo/fast rules.yml" "$timeline_repo/summary.json"
          printf 'invalid fixture\n' > "$timeline_repo/payment.test.yml"
          cp "$demo/kubernetes/before.yml" "$timeline_repo/slow rules.yml"
          git -C "$timeline_repo" add --all
          git -C "$timeline_repo" commit --quiet -m 'Propose a slower rule'
          rm -- "$timeline_repo/slow rules.yml"

          timeline_status=0
          (
            cd "$timeline_repo"
            "$cli" timeline payment.test.yml --before-ref HEAD^1 --after-ref HEAD \
              --before-rule-file 'fast rules.yml' --after-rule-file 'slow rules.yml' --rule-format kubernetes \
              --fixture-ref HEAD^1 --capture-summary summary.json \
              --alertname PaymentErrorsHigh --start 9m --end 10m --max-delay 1m \
              --format json --promtool "$RUNNER_TEMP/promtool"
          ) > timeline-regression.json || timeline_status=$?
          [[ "$timeline_status" -eq 1 ]]
          "$smoke/venv/bin/python" - "$timeline_repo" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys

          coverage = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          assert coverage["gate"] == {"max_gap_ms": 30_000, "passed": True}
          assert coverage["series_count"] == 1 and coverage["sample_count"] == 21
          series, = coverage["series"]
          assert (series["first_sample"], series["last_sample"]) == (coverage["start"], coverage["end"])
          assert series["max_sample_gap"]["duration_ms"] == 30_000

          summary = json.loads(Path("summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == 1
          assert summary["series_count"] == 1 and summary["checkpoint_count"] == 2
          assert summary["fixture_sha256"] == hashlib.sha256(Path("payment.test.yml").read_bytes()).hexdigest()

          timeline = json.loads(Path("timeline.json").read_text(encoding="utf-8"))
          assert timeline["schema_version"] == 1
          assert timeline["evaluation_interval_ms"] == 30_000
          group, = timeline["groups"]
          assert group["before"]["first_firing_offset_ms"] == 570_000
          assert group["after"]["first_firing_offset_ms"] == 330_000
          assert group["first_firing_delta_ms"] == -240_000
          assert timeline["gate"]["max_delay_ms"] == 0 and timeline["gate"]["passed"] is True

          regression = json.loads(Path("timeline-regression.json").read_text(encoding="utf-8"))
          assert regression["schema_version"] == 1
          repo = Path(sys.argv[1])
          before, after = subprocess.check_output(["git", "rev-parse", "HEAD^1", "HEAD"], cwd=repo, text=True).splitlines()
          assert regression["commits"] == {"before": before, "after": after}
          assert regression["rule_files"] == {"before": ["fast rules.yml"], "after": ["slow rules.yml"]}
          assert regression["fixture_commit"] == before
          assert regression["fixture_sha256"] == summary["fixture_sha256"]
          assert regression["capture_summary"] == "summary.json"
          visible, = regression["groups"]
          assert visible["first_firing_delta_ms"] == 30_000
          assert regression["gate"] == {
              "mode": "max-delay", "max_delay_ms": 60_000, "passed": False, "checked_groups": 1,
              "groups": [{
                  "group": 1, "status": "delayed", "before_first_firing_offset_ms": 330_000,
                  "after_first_firing_offset_ms": 570_000, "first_firing_delta_ms": 240_000,
              }],
          }
          PY

          report=$("$cli" compare payment.test.yml --before "$demo/before.rules.yml" \
            --after "$demo/after.rules.yml" --promtool "$RUNNER_TEMP/promtool")
          [[ "$report" == *'| Before | Failed | 1/2 |'* ]]
          [[ "$report" == *'| After | Passed | 2/2 |'* ]]
          "$cli" export-rules "$demo/kubernetes/after.yml" --output-dir rules
          "$RUNNER_TEMP/promtool" check rules rules/rules-1.yml

          "$cli" bundle "$demo/alertmanager.incident.json" --matrix "$demo/incident.matrix.json" \
            --output payment.zip
          "$cli" verify-bundle payment.zip --format json > bundle-verification.json
          bundle_status=0
          "$cli" compare-bundle payment.zip --after "$demo/before.rules.yml" \
            --promtool "$RUNNER_TEMP/promtool" --gate regressions --json-report bundle-regression.json \
            > bundle-regression.md || bundle_status=$?
          [[ "$bundle_status" -eq 1 ]]
          "$smoke/venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          verification = json.loads(Path("bundle-verification.json").read_text(encoding="utf-8"))
          assert verification["schema_version"] == 1
          assert verification["bundle_path"] == "payment.zip"
          assert verification["verified_files"] == [
              "capture.json", "coverage.json", "incident.json",
              "incident.matrix.json", "incident.test.yml", "rules/rules-1.yml",
          ]

          report = json.loads(Path("bundle-regression.json").read_text(encoding="utf-8"))
          assert report["bundle"] == {"path": "payment.zip", "rule_files": ["rules/rules-1.yml"]}
          assert report["gate"] == {"mode": "regressions", "passed": False}
          assert report["summary"]["before"] == {"matched": 2, "total": 2}
          assert report["summary"]["after"] == {"matched": 1, "total": 2}
          assert report["summary"]["newly_failed"] == 1
          fixture, = report["fixtures"]
          assert fixture["path"] == "payment.zip!incident.test.yml"
          PY

          "$smoke/venv/bin/python" -m zipfile --extract payment.zip payment-bundle
          cd payment-bundle
          "$RUNNER_TEMP/promtool" test rules incident.test.yml
          "$cli" incident.json --matrix incident.matrix.json --output regenerated.test.yml
          cmp -- incident.test.yml regenerated.test.yml

  composite-action:
    name: Composite Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare Kubernetes rules and committed fixtures
        run: |
          repo="$RUNNER_TEMP/composite-repo"
          rule="rules/payment alert.yml"
          candidate="rules/payment candidate.yml"
          scoped_baseline="rules/legacy payment alert.yml"
          renamed_rule="rules/renamed payment alert.yml"
          recording_rule="rules/payment recording.yml"
          bundle="incidents/payment baseline.zip"
          second_bundle="incidents/alternative baseline.zip"
          bundle_baseline="rules/bundle baseline fixed.yml"
          bundle_regression="rules/bundle candidate regressed.yml"
          git init --quiet "$repo"
          git -C "$repo" config user.name 'Integration Test'
          git -C "$repo" config user.email 'test@example.invalid'
          mkdir "$repo/rules" "$repo/incidents"
          python3 incident_to_promtool.py bundle demo/demo.json --matrix demo/incident.matrix.json \
            --rule-file demo/before.rules.yml --output "$repo/$bundle"
          python3 incident_to_promtool.py bundle demo/demo.json --matrix demo/incident.matrix.json \
            --rule-file demo/after.rules.yml --output "$repo/$second_bundle"
          (
            cd "$repo"
            python3 "$GITHUB_WORKSPACE/incident_to_promtool.py" "$GITHUB_WORKSPACE/demo/demo.json" \
              --matrix "$GITHUB_WORKSPACE/demo/incident.matrix.json" --output payment.test.yml \
              --summary-format json > payment.capture.json
          )
          python3 - "$repo" <<'PY'
          from copy import deepcopy
          import hashlib
          import json
          from pathlib import Path
          import sys

          repo = Path(sys.argv[1])
          fixture = json.loads((repo / "payment.test.yml").read_text(encoding="utf-8"))
          summary = json.loads((repo / "payment.capture.json").read_text(encoding="utf-8"))

          def save_fixture(name, fixture):
              fixture_path = f"{name}.test.yml"
              document = (json.dumps(fixture, indent=2) + "\n").encode("utf-8")
              (repo / fixture_path).write_bytes(document)
              capture = {**summary, "fixture_path": fixture_path, "fixture_sha256": hashlib.sha256(document).hexdigest()}
              (repo / f"{name}.capture.json").write_text(json.dumps(capture), encoding="utf-8")

          timing = deepcopy(fixture)
          timing["tests"][0]["alert_rule_test"][-1]["eval_time"] = "10m"
          save_fixture("timing", timing)
          group = fixture["tests"][0]
          group["input_series"][0]["values"] = "0+0x20"
          for checkpoint in group["alert_rule_test"]:
              checkpoint["exp_alerts"] = []
          save_fixture("quiet", fixture)
          PY
          cp demo/kubernetes/before.yml "$repo/$rule"
          cp demo/kubernetes/before.yml "$repo/$scoped_baseline"
          cp demo/kubernetes/after.yml "$repo/$bundle_baseline"
          git -C "$repo" add -- "$rule" "$scoped_baseline" "$bundle" "$second_bundle" "$bundle_baseline" \
            payment.test.yml payment.capture.json quiet.test.yml quiet.capture.json timing.test.yml timing.capture.json
          git -C "$repo" commit --quiet -m 'Add original payment alert'
          cp demo/kubernetes/after.yml "$repo/$rule"
          cp demo/kubernetes/after.yml "$repo/$candidate"
          sed 's/^          expr: .*$/          expr: payment:http_errors:rate2m > 1/' \
            demo/kubernetes/after.yml > "$repo/$renamed_rule"
          cat > "$repo/$recording_rule" <<'YAML'
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: payment-recording
          spec:
            groups:
              - name: payment-derived
                interval: 30s
                rules:
                  - record: payment:http_errors:rate2m
                    expr: sum(rate(payment_http_requests_total{code="500"}[2m]))
          YAML
          cp demo/kubernetes/before.yml "$repo/$bundle_regression"
          printf 'invalid replacement bundle\n' > "$repo/$bundle"
          git -C "$repo" add -- "$rule" "$candidate" "$renamed_rule" "$recording_rule" \
            "$bundle" "$bundle_regression"
          git -C "$repo" rm --quiet -- "$second_bundle" "$scoped_baseline" "$bundle_baseline"
          git -C "$repo" commit --quiet -m 'Fix late payment alert'
          printf 'invalid fixture\n' > "$repo/payment.test.yml"
          printf 'invalid fixture\n' > "$repo/timing.test.yml"
          rm -- "$repo/payment.capture.json" "$repo/quiet.test.yml" "$repo/quiet.capture.json" "$repo/timing.capture.json" \
            "$repo/$candidate" "$repo/$renamed_rule" "$repo/$recording_rule" \
            "$repo/$bundle" "$repo/$bundle_regression"
      - name: Compare the fixed rule
        id: fixed
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          fixture: payment.test.yml
          fixture-ref: HEAD^1
          capture-summaries: payment.capture.json
          rule-files: |
            rules/payment alert.yml
          rule-format: kubernetes
          timeline-alertname: PaymentErrorsHigh
          timeline-end: 10m
          timeline-max-delay: 0s
      - name: Check the successful report
        env:
          REPORT_PATH: ${{ steps.fixed.outputs.report-path }}
          TIMELINE_PASSED: ${{ steps.fixed.outputs.timeline-passed }}
        run: |
          test -f "$REPORT_PATH"
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'| Before | Failed | 1/2 |'* ]]
          [[ "$report" == *'| After | Passed | 2/2 |'* ]]
          [[ "$TIMELINE_PASSED" == true ]]
      - name: Compare two incidents with refs reversed
        id: regression
        continue-on-error: true
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          fixtures: |
            payment.test.yml
            quiet.test.yml
          fixture-ref: HEAD^1
          rule-files: |
            rules/payment alert.yml
          rule-format: kubernetes
          gate: regressions
          before-ref: HEAD
          after-ref: HEAD^1
      - name: Check that the regression failed
        env:
          OUTCOME: ${{ steps.regression.outcome }}
          REPORT_PATH: ${{ steps.regression.outputs.report-path }}
        run: |
          test "$OUTCOME" = failure
          test -f "$REPORT_PATH"
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'Gate `regressions`: **Failed**'* ]]
          [[ "$report" == *'| Before | Passed | 4/4 |'* ]]
          [[ "$report" == *'| After | Failed | 3/4 |'* ]]
          [[ "$report" == *'| <code>payment.test.yml</code> | Passed (2/2) | Failed (1/2) |'* ]]
          [[ "$report" == *'| <code>quiet.test.yml</code> | Passed (2/2) | Passed (2/2) |'* ]]
          [[ "$report" == *'| <code>payment.test.yml</code> | 1 | <code>PaymentErrorsHigh</code> | 420s | Newly failed |'* ]]
      - name: Check JSON and JUnit outputs for both comparisons
        env:
          FIXED_JSON: ${{ steps.fixed.outputs.json-report-path }}
          FIXED_JUNIT: ${{ steps.fixed.outputs.junit-report-path }}
          FIXED_COUNT: ${{ steps.fixed.outputs.newly-failed }}
          REGRESSION_JSON: ${{ steps.regression.outputs.json-report-path }}
          REGRESSION_JUNIT: ${{ steps.regression.outputs.junit-report-path }}
          REGRESSION_COUNT: ${{ steps.regression.outputs.newly-failed }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from xml.etree import ElementTree

          repo = Path(os.environ["RUNNER_TEMP"]) / "composite-repo"
          fixture_commit = subprocess.check_output(["git", "rev-parse", "HEAD^1"], cwd=repo, text=True).strip()

          def committed_bytes(path):
              return subprocess.check_output(["git", "show", f"{fixture_commit}:{path}"], cwd=repo)

          for comparison, gate, tests, newly_failed in (("FIXED", "strict", 3, 0), ("REGRESSION", "regressions", 4, 1)):
              assert os.environ[f"{comparison}_COUNT"] == str(newly_failed)
              path = Path(os.environ[f"{comparison}_JSON"])
              report = json.loads(path.read_text(encoding="utf-8"))
              assert report["schema_version"] == 1
              assert report["fixture_commit"] == fixture_commit
              assert report["gate"] == {"mode": gate, "passed": newly_failed == 0}
              assert report["summary"]["newly_failed"] == newly_failed

              junit = ElementTree.parse(os.environ[f"{comparison}_JUNIT"]).getroot()
              assert junit.tag == "testsuites"
              assert int(junit.attrib["tests"]) == tests
              assert int(junit.attrib["failures"]) == newly_failed
              assert junit.attrib["errors"] == junit.attrib["skipped"] == "0"
              suites = junit.findall("testsuite")
              fixtures = report["fixtures"]
              if comparison == "FIXED":
                  assert report["timeline"]["gate"]["passed"] is True
                  timing_suite = junit.find("testsuite[@name='Alert firing delay']")
                  assert timing_suite is not None and len(timing_suite.findall("testcase")) == 1
                  suites.remove(timing_suite)
              assert [suite.attrib["name"] for suite in suites] == [fixture["path"] for fixture in fixtures]
              for suite, fixture in zip(suites, fixtures):
                  assert int(suite.attrib["tests"]) == len(suite.findall("testcase")) == fixture["after"]["total"]
              assert len(junit.findall("testsuite/testcase/failure")) == newly_failed

              if comparison == "FIXED":
                  fixture, = fixtures
                  assert fixture["path"] == "payment.test.yml"
                  assert fixture["capture_summary"] == "payment.capture.json"
                  summary = json.loads(committed_bytes("payment.capture.json"))
                  fixture_sha256 = hashlib.sha256(committed_bytes("payment.test.yml")).hexdigest()
                  assert fixture["sha256"] == summary["fixture_sha256"] == fixture_sha256
          PY
      - name: Compare alert timing with refs reversed
        id: timing-regression
        continue-on-error: true
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          fixtures: |
            quiet.test.yml
            timing.test.yml
          fixture-ref: HEAD^1
          capture-summaries: |
            quiet.capture.json
            timing.capture.json
          before-rule-files: |
            rules/payment candidate.yml
          after-rule-files: |
            rules/legacy payment alert.yml
          rule-format: kubernetes
          gate: regressions
          before-ref: HEAD
          after-ref: HEAD^1
          timeline-alertname: PaymentErrorsHigh
          timeline-end: 10m
          timeline-max-delay: 1m
          timeline-fixture: timing.test.yml
      - name: Check the alert timing regression reports
        env:
          OUTCOME: ${{ steps.timing-regression.outcome }}
          REPORT_PATH: ${{ steps.timing-regression.outputs.report-path }}
          JSON_REPORT_PATH: ${{ steps.timing-regression.outputs.json-report-path }}
          JUNIT_REPORT_PATH: ${{ steps.timing-regression.outputs.junit-report-path }}
          NEWLY_FAILED: ${{ steps.timing-regression.outputs.newly-failed }}
          TIMELINE_PASSED: ${{ steps.timing-regression.outputs.timeline-passed }}
        run: |
          [[ "$OUTCOME" == failure ]]
          [[ "$NEWLY_FAILED" == '0' && "$TIMELINE_PASSED" == false ]]
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'Gate `regressions`: **Passed**'* ]]
          [[ "$report" == *'| Before | Passed | 4/4 |'* ]]
          [[ "$report" == *'| After | Passed | 4/4 |'* ]]
          [[ "$report" == *'Timing gate `max-delay 60s` **Failed**'* ]]
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from xml.etree import ElementTree

          report = json.loads(Path(os.environ["JSON_REPORT_PATH"]).read_text(encoding="utf-8"))
          assert report["gate"] == {"mode": "regressions", "passed": True}
          assert report["summary"]["before"] == report["summary"]["after"] == {"matched": 4, "total": 4}
          assert report["summary"]["newly_failed"] == 0
          repo = Path(os.environ["RUNNER_TEMP"], "composite-repo")
          pinned = subprocess.check_output(["git", "rev-parse", "HEAD^1"], cwd=repo, text=True).strip()
          assert report["fixture_commit"] == pinned
          _, fixture = report["fixtures"]
          assert fixture["path"] == "timing.test.yml" and fixture["capture_summary"] == "timing.capture.json"
          assert report["timeline"]["fixture_path"] == "timing.test.yml"
          gate = report["timeline"]["gate"]
          assert gate["max_delay_ms"] == 60_000 and gate["passed"] is False
          group, = gate["groups"]
          assert group["status"] == "delayed" and group["first_firing_delta_ms"] == 240_000
          assert group["before_first_firing_offset_ms"] == 330_000
          assert group["after_first_firing_offset_ms"] == 570_000

          junit = ElementTree.parse(os.environ["JUNIT_REPORT_PATH"]).getroot()
          assert junit.attrib["tests"] == "5" and junit.attrib["failures"] == "1"
          assert len(junit.findall("testsuite/testcase/failure")) == 1
          failure = junit.find("testsuite[@name='Alert firing delay']/testcase/failure")
          assert failure is not None and failure.attrib["type"] == "max-delay"
          PY
      - name: Compare a renamed alert and added recording rule
        id: split-paths
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          fixture: payment.test.yml
          fixture-ref: HEAD^1
          before-rule-files: |
            rules/legacy payment alert.yml
          after-rule-files: |
            rules/renamed payment alert.yml
            rules/payment recording.yml
          rule-format: kubernetes
      - name: Check comparison with different rule paths
        env:
          REPORT_PATH: ${{ steps.split-paths.outputs.report-path }}
          JSON_REPORT_PATH: ${{ steps.split-paths.outputs.json-report-path }}
          NEWLY_FAILED: ${{ steps.split-paths.outputs.newly-failed }}
        run: |
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'| Before | Failed | 1/2 |'* ]]
          [[ "$report" == *'| After | Passed | 2/2 |'* ]]
          [[ "$NEWLY_FAILED" == '0' ]]
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["JSON_REPORT_PATH"]).read_text(encoding="utf-8"))
          assert report["rule_files"] == {
              "before": ["rules/legacy payment alert.yml"],
              "after": ["rules/renamed payment alert.yml", "rules/payment recording.yml"],
          }
          PY
      - name: Compare a committed bundle to a proposed Kubernetes rule
        id: bundled
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          bundle: incidents/payment baseline.zip
          rule-files: |
            rules/payment candidate.yml
          rule-format: kubernetes
      - name: Check the committed bundle comparison
        env:
          REPORT_PATH: ${{ steps.bundled.outputs.report-path }}
          JSON_REPORT_PATH: ${{ steps.bundled.outputs.json-report-path }}
          NEWLY_FAILED: ${{ steps.bundled.outputs.newly-failed }}
        run: |
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'| Before | Failed | 1/2 |'* ]]
          [[ "$report" == *'| After | Passed | 2/2 |'* ]]
          [[ "$NEWLY_FAILED" == '0' ]]
          python3 - <<'PY'
          import hashlib
          from io import BytesIO
          import json
          import os
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile

          repo = Path(os.environ["RUNNER_TEMP"]) / "composite-repo"
          before, after = subprocess.check_output(["git", "rev-parse", "HEAD^1", "HEAD"], cwd=repo, text=True).splitlines()
          bundle_path = "incidents/payment baseline.zip"
          archive_bytes = subprocess.check_output(["git", "show", f"{before}:{bundle_path}"], cwd=repo)
          with ZipFile(BytesIO(archive_bytes)) as archive:
              fixture_sha256 = hashlib.sha256(archive.read("incident.test.yml")).hexdigest()

          report = json.loads(Path(os.environ["JSON_REPORT_PATH"]).read_text(encoding="utf-8"))
          assert report["commits"] == {"before": before, "after": after}
          assert report["bundle"] == {"path": bundle_path, "rule_files": ["rules/rules-1.yml"]}
          assert report["gate"] == {"mode": "strict", "passed": True}
          fixture, = report["fixtures"]
          assert fixture["sha256"] == fixture_sha256
          PY
      - name: Compare a committed bundle using rules from both refs
        id: bundled-refs
        continue-on-error: true
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          bundle: incidents/payment baseline.zip
          before-rule-files: |
            rules/bundle baseline fixed.yml
          after-rule-files: |
            rules/bundle candidate regressed.yml
          rule-format: kubernetes
          gate: regressions
      - name: Check the bundle regression against the committed baseline
        env:
          OUTCOME: ${{ steps.bundled-refs.outcome }}
          REPORT_PATH: ${{ steps.bundled-refs.outputs.report-path }}
          JSON_REPORT_PATH: ${{ steps.bundled-refs.outputs.json-report-path }}
          JUNIT_REPORT_PATH: ${{ steps.bundled-refs.outputs.junit-report-path }}
          NEWLY_FAILED: ${{ steps.bundled-refs.outputs.newly-failed }}
        run: |
          [[ "$OUTCOME" == failure ]]
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'| Before | Passed | 2/2 |'* ]]
          [[ "$report" == *'| After | Failed | 1/2 |'* ]]
          [[ "$NEWLY_FAILED" == '1' ]]
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = json.loads(Path(os.environ["JSON_REPORT_PATH"]).read_text(encoding="utf-8"))
          assert report["bundle"]["path"] == "incidents/payment baseline.zip"
          assert report["rule_files"] == {
              "before": ["rules/bundle baseline fixed.yml"],
              "after": ["rules/bundle candidate regressed.yml"],
          }
          assert report["gate"] == {"mode": "regressions", "passed": False}
          assert report["summary"]["before"] == {"matched": 2, "total": 2}
          assert report["summary"]["after"] == {"matched": 1, "total": 2}
          assert report["summary"]["newly_failed"] == 1
          junit = ElementTree.parse(os.environ["JUNIT_REPORT_PATH"]).getroot()
          assert len(junit.findall("testsuite/testcase/failure")) == 1
          PY
      - name: Compare two committed bundles to a proposed Kubernetes rule
        id: bundled-batch
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          bundles: |
            incidents/payment baseline.zip
            incidents/alternative baseline.zip
          rule-files: |
            rules/payment candidate.yml
          rule-format: kubernetes
      - name: Check the committed bundle batch comparison
        env:
          REPORT_PATH: ${{ steps.bundled-batch.outputs.report-path }}
          JSON_REPORT_PATH: ${{ steps.bundled-batch.outputs.json-report-path }}
          NEWLY_FAILED: ${{ steps.bundled-batch.outputs.newly-failed }}
        run: |
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'| Before | Failed | 3/4 |'* ]]
          [[ "$report" == *'| After | Passed | 4/4 |'* ]]
          [[ "$NEWLY_FAILED" == '0' ]]
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["JSON_REPORT_PATH"]).read_text(encoding="utf-8"))
          paths = ["incidents/payment baseline.zip", "incidents/alternative baseline.zip"]
          fixtures = report["fixtures"]
          assert report["bundles"] == [{"path": path, "rule_files": ["rules/rules-1.yml"]} for path in paths]
          assert [fixture["path"] for fixture in fixtures] == [f"{path}!incident.test.yml" for path in paths]
          assert [fixture["before"] for fixture in fixtures] == [{"matched": 1, "total": 2}, {"matched": 2, "total": 2}]
          assert all(fixture["after"] == {"matched": 2, "total": 2} for fixture in fixtures)
          assert report["summary"]["newly_failed"] == 0
          PY
