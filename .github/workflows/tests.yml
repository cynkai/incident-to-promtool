name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  promtool:
    name: promtool ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.9.0'
            sha256: 27c7438ffbd2a99a25b14e5b1540bdc4f14519b5c5495efad537a61296075198
          - version: '3.11.0'
            sha256: ff799c3e4c318e17dec14aaaa406a4da328fabb4578336b36d96d893870c3b76
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download and verify promtool
        env:
          VERSION: ${{ matrix.version }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          asset="prometheus-${VERSION}.linux-amd64"
          archive="$RUNNER_TEMP/promtool.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/${asset}.tar.gz"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" \
            --strip-components=1 "${asset}/promtool"
      - name: Set up test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run tests
        run: |
          PROMTOOL="$RUNNER_TEMP/promtool" "$RUNNER_TEMP/test-venv/bin/python" -m unittest discover -s tests -v
