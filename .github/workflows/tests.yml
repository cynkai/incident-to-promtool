name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  promtool:
    name: promtool ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['3.9.0', '3.11.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download and verify promtool
        env:
          VERSION: ${{ matrix.version }}
        run: bash scripts/install-promtool.sh "$VERSION" "$RUNNER_TEMP"
      - name: Set up test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run tests
        run: |
          PROMTOOL="$RUNNER_TEMP/promtool" "$RUNNER_TEMP/test-venv/bin/python" -m unittest discover -s tests -v

  composite-action:
    name: Composite Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare Kubernetes rules and fixture
        run: |
          repo="$RUNNER_TEMP/composite-repo"
          rule="rules/payment alert.yml"
          git init --quiet "$repo"
          git -C "$repo" config user.name 'Integration Test'
          git -C "$repo" config user.email 'test@example.invalid'
          mkdir "$repo/rules"
          python3 incident_to_promtool.py demo/demo.json \
            --matrix demo/incident.matrix.json --output "$repo/payment.test.yml"
          python3 - "$repo" <<'PY'
          import json
          from pathlib import Path
          import sys

          repo = Path(sys.argv[1])
          fixture = json.loads((repo / "payment.test.yml").read_text(encoding="utf-8"))
          group = fixture["tests"][0]
          group["input_series"][0]["values"] = "0+0x20"
          for checkpoint in group["alert_rule_test"]:
              checkpoint["exp_alerts"] = []
          (repo / "quiet.test.yml").write_text(json.dumps(fixture), encoding="utf-8")
          PY
          cp demo/kubernetes/before.yml "$repo/$rule"
          git -C "$repo" add -- "$rule" payment.test.yml quiet.test.yml
          git -C "$repo" commit --quiet -m 'Add original payment alert'
          cp demo/kubernetes/after.yml "$repo/$rule"
          git -C "$repo" add -- "$rule"
          git -C "$repo" commit --quiet -m 'Fix late payment alert'
      - name: Compare the fixed rule
        id: fixed
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          fixture: payment.test.yml
          rule-files: |
            rules/payment alert.yml
          rule-format: kubernetes
      - name: Check the successful report
        env:
          REPORT_PATH: ${{ steps.fixed.outputs.report-path }}
        run: |
          test -f "$REPORT_PATH"
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'| Before | Failed | 1/2 |'* ]]
          [[ "$report" == *'| After | Passed | 2/2 |'* ]]
      - name: Compare two incidents with refs reversed
        id: regression
        continue-on-error: true
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/composite-repo
          fixtures: |
            payment.test.yml
            quiet.test.yml
          rule-files: |
            rules/payment alert.yml
          rule-format: kubernetes
          gate: regressions
          before-ref: HEAD
          after-ref: HEAD^1
      - name: Check that the regression failed
        env:
          OUTCOME: ${{ steps.regression.outcome }}
          REPORT_PATH: ${{ steps.regression.outputs.report-path }}
        run: |
          test "$OUTCOME" = failure
          test -f "$REPORT_PATH"
          report=$(cat "$REPORT_PATH")
          [[ "$report" == *'Gate `regressions`: **Failed**'* ]]
          [[ "$report" == *'| Before | Passed | 4/4 |'* ]]
          [[ "$report" == *'| After | Failed | 3/4 |'* ]]
          [[ "$report" == *'| <code>payment.test.yml</code> | Passed (2/2) | Failed (1/2) |'* ]]
          [[ "$report" == *'| <code>quiet.test.yml</code> | Passed (2/2) | Passed (2/2) |'* ]]
          [[ "$report" == *'| <code>payment.test.yml</code> | 1 | <code>PaymentErrorsHigh</code> | 420s | Newly failed |'* ]]
